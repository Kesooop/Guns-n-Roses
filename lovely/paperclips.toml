[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = '=[SMODS paperback "content/paperclip/platinum_clip.lua"]'
pattern = """          paperback_pink_clip = function(card)
    return { x_mult = card.ability.paperback_pink_clip.x_mult }
  end,"""
position = "after"
payload = """  roses_diamond_clip = function() --we gotta find a way toscore this bih
  end,
  roses_magenta_clip = function(card)
  local clips = PB_UTIL.count_paperclips { area = G.hand }
    return {  aij_balance_percent =  card.ability.roses_magenta_clip.balance_base + card.ability.roses_magenta_clip.balance_base + clips * card.ability.roses_magenta_clip.balance_mod * 0.01}
  end,
  roses_indigo_clip = function(card)
  local planet = PB_UTIL.get_planet_for_hand(context.scoring_name)
    if #G.consumeables.cards + G.GAME.consumeable_buffer < G.consumeables.config.card_limit and 
    SMODS.pseudorandom_probability(card, "indigo_clip", card.ability.roses_indigo_clip.numerator, card.ability.roses_indigo_clip.denominator, "indigo_clip") then
      G.GAME.consumeable_buffer = G.GAME.consumeable_buffer + 1
      return {
        message = localize("k_plus_planet"),
        colour = G.C.SECONDARY_SET.Planet,
        message_card = card,
        func = function()
          G.E_MANAGER:add_event(Event({
            func = function()
              SMODS.add_card { key = planet }
              G.GAME.consumeable_buffer = 0
              return true
            end
          }))
        end
      }
    end
  end,
"""
overwrite = true
match_indent = true
